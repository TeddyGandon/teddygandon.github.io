name: Deploy to GitHub Pages

on:
  push:
master  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check spelling
        run: npm run test:spelling

      - name: Build
        run: npm run build

      # After the build, so the content checks also cover the external
      # sources it just fetched — exactly what's about to be deployed.
      - name: Unit tests (flags, scripts, content)
        run: npm test

      - name: End-to-end tests (every page of the build)
        run: npm run test:e2e

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
