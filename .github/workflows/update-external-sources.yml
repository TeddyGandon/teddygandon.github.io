name: Update external sources

# Daily refresh of the content pulled from Medium, LeadDev and LinkedIn
# (src/data/official-publications.js, src/data/linkedin.js). Changes are
# committed back to main so the upserted history is kept, then the site is
# redeployed.
on:
  schedule:
    - cron: '0 5 * * *' # every day at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed data files
  actions: write # trigger the deploy workflow

concurrency:
  group: update-external-sources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Load external sources
        run: npm run load-external-sources

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- src/data; then
            echo "No content changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "chore: update external sources content"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so the
      # deploy is started explicitly (workflow_dispatch is the exception).
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master
