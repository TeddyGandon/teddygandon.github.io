<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#121216" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://teddygandon.github.io/" id="meta-canonical" />

    <meta
      name="description"
      content="Teddy Gandon — Engineering Manager. Twenty years of engineering, specialized in multicultural management."
      id="meta-description"
    />
    <title>Teddy Gandon — Engineering Manager</title>

    <!--
      Static fallback for link-preview bots (Slack, LinkedIn, X, ...), which don't
      execute JS and only ever see this file's initial markup. src/utils/seo.js
      updates these same tags per route for real browsers and for Google, which
      does render JS — but a deep link shared before it's crawled will still show
      this homepage card. Fixing that fully needs prerendering/SSR.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Teddy Gandon" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://teddygandon.github.io/" id="meta-og-url" />
    <meta property="og:title" content="Teddy Gandon — Engineering Manager" id="meta-og-title" />
    <meta
      property="og:description"
      content="Teddy Gandon — Engineering Manager. Twenty years of engineering, specialized in multicultural management."
      id="meta-og-description"
    />
    <meta property="og:image" content="https://teddygandon.github.io/og-image.png" id="meta-og-image" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Teddy Gandon — Engineering Manager" id="meta-twitter-title" />
    <meta
      name="twitter:description"
      content="Teddy Gandon — Engineering Manager. Twenty years of engineering, specialized in multicultural management."
      id="meta-twitter-description"
    />
    <meta name="twitter:image" content="https://teddygandon.github.io/og-image.png" id="meta-twitter-image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Teddy Gandon",
        "jobTitle": "Engineering Manager",
        "url": "https://teddygandon.github.io/",
        "sameAs": ["https://www.linkedin.com/in/teddygandon/", "https://github.com/teddygandon"],
        "knowsAbout": [
          "Engineering management",
          "Multicultural leadership",
          "Agile",
          "Cloud architecture",
          "Project management"
        ]
      }
    </script>

    <!-- Single Page Apps for GitHub Pages: redirect 404.html's query-string encoded path back to the real route. https://github.com/rafgraph/spa-github-pages -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
