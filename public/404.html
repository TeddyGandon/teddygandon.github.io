<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Teddy Gandon — Engineering Manager</title>
    <!-- Single Page Apps for GitHub Pages: encode the requested path into a query string and
         redirect to the root, where index.html's inline script decodes it back. This lets
         Vue Router's history mode serve clean URLs on GitHub Pages, which has no server-side
         rewrite rules. https://github.com/rafgraph/spa-github-pages -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
