<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 80 800 440" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="80" width="800" height="440" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <g transform="translate(400, 230)">
    <path d="M -15 -10 L -130 -100 L -110 -40 L -15 35 Z" fill="url(#primaryGrad)" />
    <path d="M -15 25 L -100 -25 L -85 10 L -15 65 Z" fill="url(#primaryGrad)" opacity="0.8" />
    <path d="M -15 55 L -70 15 L -60 40 L -15 85 Z" fill="url(#primaryGrad)" opacity="0.5" />
    <path d="M 15 -10 L 130 -100 L 110 -40 L 15 35 Z" fill="url(#primaryGrad)" />
    <path d="M 15 25 L 100 -25 L 85 10 L 15 65 Z" fill="url(#primaryGrad)" opacity="0.8" />
    <path d="M 15 55 L 70 15 L 60 40 L 15 85 Z" fill="url(#primaryGrad)" opacity="0.5" />
    <path d="M 0 120 L -35 50 L 0 70 L 35 50 Z" fill="url(#primaryGrad)" filter="url(#glow)" />
    <g transform="translate(0, 10)" filter="url(#glow)">
      <circle cx="0" cy="0" r="8" fill="#ffffff" />
      <path d="M -35 -25 L -55 0 L -35 25" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 35 -25 L 55 0 L 35 25" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="12" y1="-28" x2="-12" y2="28" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    </g>
  </g>
  <g text-anchor="middle">
    <text x="400" y="445" 
          fill="#ffffff" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="48" 
          font-weight="900" 
          letter-spacing="10">SQUADRON</text>
    <text x="400" y="485" 
          fill="#0284c7" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="14" 
          font-weight="600" 
          letter-spacing="4">AUTONOMOUS ISSUE-TO-CODE ENGINE</text>
  </g>
</svg>
